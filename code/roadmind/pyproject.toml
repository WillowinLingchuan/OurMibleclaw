[project]
name = "roadmind"
version = "0.2.0"
description = "交通事故辅助研判智能体 RoadMind · 原型代码"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# ─────────────────────────────────────────────────────────────
# 分层依赖 —— 按方案文档的优先级排列，用到哪层装哪层
#   安装某一层：uv sync --extra <组名>
#   可叠加：    uv sync --extra core --extra agents
# ─────────────────────────────────────────────────────────────
[project.optional-dependencies]

# ① 核心：文书处理与检索栈
#    对应方案里「唯一的技术命门，建议最先做」的那一项（验证清单第 1 条）
#    这一层今天装、明天就能跑通「解析 → 三段切分 → 泄漏扫描」
core = [
    "numpy",
    "pandas",
    "jieba",            # 中文分词（条款 / 要件的关键词检索）
    "pypdf",            # PDF 文书解析
    "python-docx",      # DOCX 文书解析
    "openpyxl",         # 表格类材料（勘验记录导出）
    "rank-bm25",        # 轻量词法检索，先跑通再上向量
]

# ② 多智能体编排 —— A1/A2/A3/A4 + 编排器（LangGraph 状态图）
#    ★ 优先级已上升：现在是主力，不再是可选项
agents = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "pydantic",
    "httpx",
]

# ③ 向量检索 —— ⚠️ 约 2-3 GB（拉 torch），词法检索不够用时再装
rag = [
    "sentence-transformers",
    "faiss-cpu",
]

# ④ 视觉提取 —— ⚠️ 约 2.5-3 GB
#    仅当案卷材料含影像时才是 A1 的一个可选输入通道；纯文本材料不需要
vision = [
    "ultralytics",
    "torch",
    "opencv-python",
]

# ⑤ 前端 —— 研判工作台 + 前后对比视图 + 思考链可视化
ui = [
    "streamlit",
    "pyecharts",
]

# ⑥ 历史退路（不装、不写进方案）—— 原 SUMO 仿真闭环的三件套，
#    仅供需要复现旧版论证时使用，与当前方案无关
sumo = [
    "eclipse-sumo>=1.27",
    "traci>=1.27",
    "sumolib>=1.27",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# 纯脚本工程，不做成可安装包
package = false
